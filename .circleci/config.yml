version: 2.1
jobs:
  test-node:
    # Install node dependencies and run tests
    docker:
      - image: oven/bun:1.3
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-v1-{{ checksum "bun.lock" }}
            - bun-v1-
      - run:
          name: Install packages
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-v1-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
      - run:
          name: Run tests
          command: cd packages/openlegion && bun run test:ci
      - store_test_results:
          path: packages/openlegion/.artifacts/unit
  test-go:
    # Install go modules and run tests
    docker:
      - image: cimg/go:1.22
    steps:
      - checkout
      - run:
          name: Run tests
          command: gotestsum --junitfile junit.xml
      - store_test_results:
          path: junit.xml
  build-go-executables:
    # Build go executables and store them as artifacts
    docker:
      - image: cimg/go:1.22
    steps:
      - checkout
      - run:
          name: Create the ~/artifacts directory if it doesn't exist
          command: mkdir -p ~/artifacts
      - run:
          name: Build executables
          command: go build -o ~/artifacts ./...
      - store_artifacts:
          path: ~/artifacts
          destination: executables
  deploy:
    # This is an example deploy job, not actually used by the workflow
    docker:
      - image: cimg/base:stable
    steps:
      # Replace this with steps to deploy to users
      - run:
          name: deploy
          command: '#e.g. ./deploy.sh'
      - run:
          name: found github actions config
          command: ':'
workflows:
  build-and-test:
    jobs:
      - test-node
      - test-go
      - build-go-executables:
          requires:
            - test-node
            - test-go
