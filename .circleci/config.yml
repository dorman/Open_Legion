version: 2.1

jobs:
  test-node:
    docker:
      - image: oven/bun:1.3
    steps:
      - checkout
      - restore_cache:
          keys:
            - bun-v1-{{ checksum "bun.lock" }}
            - bun-v1-
      - run:
          name: Install build dependencies
          command: apt-get update && apt-get install -y python3 make g++
      - run:
          name: Install packages
          command: bun install --frozen-lockfile
      - save_cache:
          key: bun-v1-{{ checksum "bun.lock" }}
          paths:
            - ~/.bun/install/cache
      - run:
          name: Run tests
          no_output_timeout: 30m
          command: |
            cd packages/openlegion
            echo "Starting openlegion test suite..."
            bun run test:ci
      - store_test_results:
          path: packages/openlegion/.artifacts/unit

  test-go:
    docker:
      - image: cimg/go:1.22
    steps:
      - checkout
      - run:
          name: Run tests
          no_output_timeout: 10m
          command: gotestsum --junitfile junit.xml -- ./...
      - store_test_results:
          path: junit.xml
          when: always

  build-go-executables:
    docker:
      - image: cimg/go:1.22
    steps:
      - checkout
      - run:
          name: Create artifacts directory
          command: mkdir -p ~/artifacts
      - run:
          name: Build executables
          command: go build -o ~/artifacts ./cmd/openlegion-microvm
      - store_artifacts:
          path: ~/artifacts
          destination: executables

workflows:
  build-and-test:
    jobs:
      - test-node
      - test-go
      - build-go-executables:
          requires:
            - test-node
            - test-go
