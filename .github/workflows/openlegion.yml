name: openlegion

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  openlegion:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /openlegion') ||
      startsWith(github.event.comment.body, '/openlegion')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - uses: ./.github/actions/setup-bun

      - name: Run openlegion
        uses: dorman/Open_Legion/github@dev # latest
        env:
          OPENLEGION_API_KEY: ${{ secrets.OPENLEGION_API_KEY }}
          OPENLEGION_PERMISSION: '{"bash": "deny"}'
        with:
          model: openlegion/claude-opus-4-5
